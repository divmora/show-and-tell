name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    uses: divmora/.github/.github/workflows/node-ci.yml@main
    with:
      package-manager: 'pnpm'
      pnpm-version: '12'
      node-version: '26'
      lint-command: 'pnpm run lint'
      test-command: 'test'
      enable-build: true
      build-command: 'pnpm run build && pnpm run build:server'
