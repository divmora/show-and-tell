name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    uses: divmora/.github/.github/workflows/node-ci.yml@main
    with:
      package-manager: 'npm'
      node-version: '26'
      lint-command: 'npm run lint'
      test-command: 'test'
      enable-build: true
      build-command: 'npm run build && npm run build:server'
